<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>El ojo y el oído · Juego de partes</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👁️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1d2b4f; --paper:#fdfcf8; --grid:#d9dee8;
  --ojo:#8db9dc; --ojo-dark:#1f4a86;
  --oido:#e9a6b4; --oido-dark:#9c1f33;
  --ok:#2f9a5a; --bad:#d6453f;
  --accent:var(--ojo); --accent-dark:var(--ojo-dark);
  font-family:"Baloo 2",system-ui,"Segoe UI",Roboto,sans-serif;
  color:var(--ink);
}
body.oido{--accent:var(--oido);--accent-dark:var(--oido-dark)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background-color:var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  -webkit-tap-highlight-color:transparent;
}
header{
  display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;
  gap:10px;padding:12px 16px;max-width:1100px;margin:0 auto;
}
h1{margin:0;font-size:clamp(1.25rem,4vw,1.8rem);font-weight:800;line-height:1.1}
.tabs{display:flex;gap:8px}
.tab{
  font:inherit;font-weight:700;font-size:1.05rem;cursor:pointer;
  border:3px solid var(--ink);background:#fff;color:var(--ink);
  padding:6px 16px;border-radius:14px;box-shadow:3px 3px 0 var(--ink);
}
.tab[aria-selected="true"]{background:var(--accent);}
.tab:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
main{
  max-width:1100px;margin:0 auto;padding:0 16px 16px;
  display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;align-items:start;
}
.sheet{
  position:relative;container-type:inline-size;width:100%;
  max-width:calc((100vh - 90px) * var(--ratio));margin:0 auto;
  border-radius:6px;box-shadow:0 2px 0 rgba(29,43,79,.15),0 10px 24px rgba(29,43,79,.12);
  background:#fff;
}
.sheet img{display:block;width:100%;height:auto;border-radius:6px;user-select:none;-webkit-user-drag:none;pointer-events:none}
.zone{
  position:absolute;font:inherit;padding:0 4px;margin:0;cursor:pointer;
  border:none;background:transparent;border-radius:4px;
  display:flex;align-items:center;justify-content:center;text-align:center;
  font-weight:800;font-size:clamp(10px,3.1cqw,24px);line-height:1;color:var(--ink);
}
.zone.over,.zone.target{outline:4px dashed var(--accent-dark);outline-offset:-2px;background:rgba(255,255,255,.6)}
.zone.hint{animation:hint 1s ease-in-out 3}
.zone.ok{background:#e4f5ea;color:var(--ok);outline:3px solid var(--ok);outline-offset:-3px;animation:pop .35s ease-out;cursor:default}
.zone.bad{background:#fde6e4;animation:shake .4s}
aside{position:sticky;top:12px}
.status{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;font-weight:700}
.status .big{font-size:1.6rem;font-weight:800}
.help{margin:0 0 12px;font-size:1rem;line-height:1.35;font-weight:500}
.bank{display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start;min-height:60px}
.chip{
  font:inherit;font-weight:700;font-size:1.1rem;color:var(--ink);
  background:#fff;border:3px solid var(--accent-dark);border-radius:12px;
  padding:6px 14px;cursor:grab;touch-action:none;user-select:none;
  box-shadow:2px 3px 0 var(--accent-dark);
  transform:rotate(var(--tilt,0deg));transition:transform .15s;
}
.chip.selected{background:var(--accent);transform:rotate(0) scale(1.06)}
.chip.lifted{opacity:.3}
.chip.bad{animation:shake .4s}
.ghost{
  position:fixed;left:0;top:0;z-index:50;pointer-events:none;margin:0;
  transform:translate(-50%,-60%) rotate(-3deg) scale(1.1);cursor:grabbing;
  box-shadow:4px 6px 0 var(--accent-dark);
}
.reset{
  font:inherit;font-weight:700;margin-top:16px;background:none;border:none;
  color:var(--accent-dark);text-decoration:underline;cursor:pointer;font-size:1rem;padding:4px 0;
}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.done{
  position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
  background:rgba(29,43,79,.45);padding:20px;
}
.done.show{display:flex}
.card{
  background:#fff;border:4px solid var(--ink);border-radius:20px;box-shadow:6px 6px 0 var(--ink);
  padding:24px 26px;text-align:center;max-width:360px;animation:pop .4s ease-out;
}
.card .emoji{font-size:3.5rem;line-height:1}
.card h2{margin:6px 0 4px;font-size:1.8rem;font-weight:800}
.card p{margin:0 0 16px;font-size:1.1rem}
.card .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{translate:0}25%{translate:-6px}75%{translate:6px}}
@keyframes hint{50%{background:rgba(255,214,0,.55)}}
@media (max-width:760px){
  main{grid-template-columns:1fr;gap:12px;padding-bottom:0}
  .sheet{max-width:100%}
  aside{
    position:sticky;bottom:0;top:auto;z-index:20;margin:0 -16px;
    background:rgba(253,252,248,.97);border-top:3px solid var(--ink);
    padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));
  }
  .help{display:none}
  .status{margin-bottom:6px}
  .status .big{font-size:1.3rem}
  .bank{gap:8px}
  .chip{font-size:1rem;padding:5px 11px}
  .reset{margin-top:6px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <h1>¿Dónde va cada parte?</h1>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-set="ojo" aria-selected="true">👁️ El ojo</button>
    <button class="tab" role="tab" data-set="oido" aria-selected="false">👂 El oído</button>
  </div>
</header>
<main>
  <div class="sheet" id="sheet"><img id="pic" alt=""></div>
  <aside>
    <div class="status"><span>Colocadas</span><span class="big" id="count">0 / 0</span></div>
    <p class="help">Arrastra cada nombre hasta su caja. También puedes tocar un nombre y después tocar la caja.</p>
    <div class="bank" id="bank"></div>
    <button class="reset" id="reset">Empezar de nuevo</button>
  </aside>
</main>
<div class="done" id="done" role="dialog" aria-modal="true" aria-labelledby="doneTitle">
  <div class="card">
    <div class="emoji" id="doneEmoji">🎉</div>
    <h2 id="doneTitle">¡Muy bien!</h2>
    <p id="doneText"></p>
    <div class="row">
      <button class="tab" id="again">Repetir</button>
      <button class="tab" id="next" style="background:var(--accent)">Ir al oído</button>
    </div>
  </div>
</div>

const $=s=>document.querySelector(s);
const sheet=$("#sheet"),pic=$("#pic"),bank=$("#bank"),count=$("#count");
let cur="ojo",placed=0,errors=0,selected=null,misses={};

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function load(set){
  cur=set;placed=0;errors=0;selected=null;misses={};
  document.body.classList.toggle("oido",set==="oido");
  document.querySelectorAll(".tab[data-set]").forEach(t=>t.setAttribute("aria-selected",t.dataset.set===set));
  const S=SETS[set];
  sheet.style.setProperty("--ratio",S.ratio);
  pic.src=IMG[set];pic.alt=set==="ojo"?"Dibujo del ojo con sus partes":"Dibujo del oído con sus partes";
  sheet.querySelectorAll(".zone").forEach(z=>z.remove());
  S.parts.forEach(p=>{
    const z=document.createElement("button");
    z.className="zone";z.dataset.id=p.id;z.setAttribute("aria-label","Caja vacía");
    const[x,y,w,h]=p.box;Object.assign(z.style,{left:x+"%",top:y+"%",width:w+"%",height:h+"%"});
    z.addEventListener("click",()=>{if(selected)tryPlace(selected,z)});
    sheet.appendChild(z);
  });
  bank.innerHTML="";
  shuffle([...S.parts]).forEach(p=>{
    const c=document.createElement("button");
    c.className="chip";c.textContent=p.name;c.dataset.id=p.id;
    c.style.setProperty("--tilt",(Math.random()*6-3).toFixed(1)+"deg");
    attachDrag(c);bank.appendChild(c);
  });
  updateCount();
}

function updateCount(){count.textContent=placed+" / "+SETS[cur].parts.length}

function select(c){
  if(selected)selected.classList.remove("selected");
  sheet.querySelectorAll(".zone").forEach(z=>z.classList.remove("target"));
  selected=(selected===c)?null:c;
  if(selected){selected.classList.add("selected");
    sheet.querySelectorAll(".zone:not(.ok)").forEach(z=>z.classList.add("target"));}
}

function tryPlace(chip,zone){
  sheet.querySelectorAll(".zone").forEach(z=>z.classList.remove("target","over"));
  if(!zone||zone.classList.contains("ok")){chip.classList.remove("selected");selected=null;return}
  if(zone.dataset.id===chip.dataset.id){
    zone.textContent=chip.textContent;zone.classList.remove("hint");zone.classList.add("ok");
    zone.setAttribute("aria-label",chip.textContent+", correcto");zone.disabled=true;
    chip.remove();selected=null;placed++;updateCount();
    if(placed===SETS[cur].parts.length)setTimeout(finish,450);
  }else{
    errors++;
    zone.classList.remove("bad");void zone.offsetWidth;zone.classList.add("bad");
    chip.classList.remove("bad","selected");void chip.offsetWidth;chip.classList.add("bad");
    selected=null;
    misses[chip.dataset.id]=(misses[chip.dataset.id]||0)+1;
    if(misses[chip.dataset.id]>=2){
      const right=sheet.querySelector('.zone[data-id="'+chip.dataset.id+'"]');
      right.classList.remove("hint");void right.offsetWidth;right.classList.add("hint");
    }
  }
}

document.addEventListener("animationend",e=>{if(e.animationName==="shake")e.target.classList.remove("bad");if(e.animationName==="hint")e.target.classList.remove("hint")});
function attachDrag(chip){
  let start=null,ghost=null,overZone=null;
  chip.addEventListener("pointerdown",e=>{
    if(e.button!==0)return;
    start={x:e.clientX,y:e.clientY};chip.setPointerCapture(e.pointerId);
  });
  chip.addEventListener("pointermove",e=>{
    if(!start)return;
    if(!ghost){
      if(Math.hypot(e.clientX-start.x,e.clientY-start.y)<8)return;
      ghost=chip.cloneNode(true);ghost.classList.add("ghost");ghost.classList.remove("selected");
      document.body.appendChild(ghost);chip.classList.add("lifted");
      if(selected)select(selected);
    }
    ghost.style.left=e.clientX+"px";ghost.style.top=e.clientY+"px";
    const el=document.elementFromPoint(e.clientX,e.clientY);
    const z=el&&el.closest(".zone:not(.ok)");
    if(z!==overZone){if(overZone)overZone.classList.remove("over");overZone=z;if(z)z.classList.add("over")}
  });
  const end=e=>{
    if(!start)return;start=null;
    if(ghost){
      ghost.remove();ghost=null;chip.classList.remove("lifted");
      if(overZone)overZone.classList.remove("over");
      if(overZone)tryPlace(chip,overZone);
      overZone=null;
    }else select(chip);
  };
  chip.addEventListener("pointerup",end);
  chip.addEventListener("pointercancel",()=>{start=null;if(ghost){ghost.remove();ghost=null;chip.classList.remove("lifted")}});
  chip.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();select(chip)}});
  chip.addEventListener("click",e=>e.preventDefault());
}

function finish(){
  const other=cur==="ojo"?"oido":"ojo";
  $("#doneEmoji").textContent=errors===0?"🏆":"🎉";
  $("#doneTitle").textContent=errors===0?"¡Perfecto!":"¡Muy bien!";
  $("#doneText").textContent=errors===0?"Todas a la primera. ¡Sin ningún fallo!":"Lo has completado con "+errors+(errors===1?" fallo.":" fallos.");
  $("#next").textContent=other==="oido"?"Ir al oído":"Ir al ojo";
  $("#next").onclick=()=>{$("#done").classList.remove("show");load(other)};
  $("#done").classList.add("show");$("#again").focus();
}
$("#again").onclick=()=>{$("#done").classList.remove("show");load(cur)};
$("#reset").onclick=()=>load(cur);
document.querySelectorAll(".tab[data-set]").forEach(t=>t.addEventListener("click",()=>load(t.dataset.set)));
load("ojo");
</script>
</body>
</html>
